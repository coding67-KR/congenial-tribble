name: Build Chicken Defense APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate bundled PNG and WAV assets
        run: python3 tools/generate_assets.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install Gradle 9.6.0
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        run: /tmp/gradle-9.6.0/bin/gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chicken-defense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
